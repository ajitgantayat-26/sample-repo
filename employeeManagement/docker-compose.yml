services:
  # 1. The Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-container
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data



  # 2. Your Spring Boot Application Service
  spring-app:
    build: .  # Points to the Dockerfile in the current directory
    container_name: emp-mgmt
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
      #- logstash # Ensures the DB starts first
    environment:
      # Inject DB credentials into Spring Boot application properties
      #SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/mydatabase
      #Configuring for local database call
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      LOGSTASH_HOST: logstash
      SPRING_PROFILES_ACTIVE: prod

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    container_name: logstash
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  pgdata: